name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build y tests (unitarios, integración, E2E de API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers usa el Docker del runner para levantar PostgreSQL.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend · tests unitarios y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: E2E · Playwright contra el stack Docker completo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar entorno (secretos efímeros generados en el runner)
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          # La suite hace muchas peticiones seguidas desde la misma IP y el mismo alumno.
          printf 'RATE_LIMIT_LOGIN_PER_MINUTE=1000\nRATE_LIMIT_QUESTIONS_PER_MINUTE=1000\nRATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE=1000\n' >> .env
          # IA y voz simuladas: la CI no usa claves ni depende de proveedores externos.
          sed -i "s|^LLM_PROVIDER=.*|LLM_PROVIDER=mock|" .env
          echo 'STT_PROVIDER=mock' >> .env

      - name: Levantar PostgreSQL + backend + frontend (nginx)
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Ejecutar E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e

      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            docker-compose.log
          retention-days: 7
