# Puerto con el que el navegador ve la app (el publicado por Docker, p. ej. APP_PORT), extraído del Host.
map $http_host $forwarded_port {
    ~:(?<port>[0-9]+)$ $port;
    default 80;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # El audio de una pregunta pesa < 1 MB; el backend limita a 5 MB.
    client_max_body_size 6m;

    # API: mismo origen que la SPA (sin CORS). El backend confía en X-Forwarded-For de esta red privada.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Host + puerto originales: Spring reconoce la petición como del mismo origen (si no, CORS la rechaza).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Recursos con hash en el nombre: caché larga.
    location ~* \.(?:js|css|woff2?|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del router devuelve index.html (sin caché, para recoger nuevas versiones).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
