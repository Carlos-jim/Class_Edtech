spring:
  application:
    name: tutor-backend
  config:
    # Lee el .env de la raíz del monorepo (desarrollo local). En contenedores se usan variables de entorno reales.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tutor}
    username: ${DB_USER:tutor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona Flyway
  flyway:
    # db/migration = esquema; db/seed = datos de demostración (curso, lecciones, alumnos de prueba)
    locations: classpath:db/migration,classpath:db/seed

  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Límite duro del servidor; la API valida además el tamaño y el formato real del audio.
      max-file-size: 5MB
      max-request-size: 6MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET:} # obligatorio: la app no arranca sin él
      ttl: ${JWT_TTL:2h}
      issuer: lms-tutor
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

tutor:
  llm:
    # mock (por defecto, sin clave) | groq
    provider: ${LLM_PROVIDER:mock}

speech:
  # mock | groq (por defecto, el mismo proveedor que el tutor)
  provider: ${STT_PROVIDER:${LLM_PROVIDER:mock}}
  max-audio-size: 5MB

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  chat-model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  transcription-model: ${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
  temperature: 0.2 # baja: respuestas fieles a la lección
  max-tokens: 600
  connect-timeout: 3s
  read-timeout: 15s

server:
  tomcat:
    # Tomcat lee hasta 10 MB de una subida rechazada para poder responder 413 con el error explicado;
    # por encima corta la conexión (protección frente a abusos).
    max-swallow-size: 10MB
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
