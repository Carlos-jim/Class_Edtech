spring:
  application:
    name: tutor-backend
  config:
    # Lee el .env de la raíz del monorepo (desarrollo local). En contenedores se usan variables de entorno reales.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tutor}
    username: ${DB_USER:tutor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona Flyway
  flyway:
    # db/migration = esquema; db/seed = datos de demostración (curso, lecciones, alumnos de prueba)
    locations: classpath:db/migration,classpath:db/seed

  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Límite duro del servidor; la API valida además el tamaño y el formato real del audio.
      max-file-size: 5MB
      max-request-size: 6MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET:} # obligatorio: la app no arranca sin él
      ttl: ${JWT_TTL:2h}
      issuer: lms-tutor
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:          # por IP: frena la fuerza bruta
      requests: ${RATE_LIMIT_LOGIN_PER_MINUTE:20}
      window: 1m
    questions:      # por alumno: protege la cuota del proveedor de IA
      requests: ${RATE_LIMIT_QUESTIONS_PER_MINUTE:15}
      window: 1m
    transcriptions: # por alumno
      requests: ${RATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE:15}
      window: 1m

tutor:
  llm:
    # gemini (por defecto) | cerebras (rápido, solo chat) | groq | mistral | mock (solo tests)
    provider: ${LLM_PROVIDER:gemini}

speech:
  # gemini | groq | mistral | mock (por defecto, el mismo proveedor que el tutor; cerebras no transcribe)
  provider: ${STT_PROVIDER:${LLM_PROVIDER:gemini}}
  max-audio-size: 5MB
  tts:
    # piper (en la imagen Docker) | none (desarrollo sin Piper: el navegador usa su propia voz) | mock (tests)
    engine: ${TTS_ENGINE:none}
    piper-binary: ${PIPER_BINARY:/opt/piper/piper}
    piper-model: ${PIPER_MODEL:/opt/piper/voices/es_ES-davefx-medium.onnx}
    timeout: 20s
    max-concurrent: 2
    cache-size: 30

# Proveedores con API compatible con OpenAI (mismos adaptadores; se elige con LLM_PROVIDER / STT_PROVIDER).
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    # Los "lite" responden en 1-3 s y sufren menos picos de demanda (503) en el plan gratuito.
    # Varios modelos separados por comas = relevo: si uno no responde en 2 s se pide también al siguiente y gana
    # el primero (cada modelo tiene su propia cola en el plan gratuito).
    chat-model: ${GEMINI_MODEL:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest}
    transcription-model: ${GEMINI_TRANSCRIPTION_MODEL:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest}
    temperature: 0.2 # baja: respuestas fieles a la lección
    max-tokens: 1000
    connect-timeout: 3s
    # El modelo lite responde en 1-5 s; en picos de demanda Gemini puede quedarse colgado: mejor fallar pronto,
    # reintentar una vez y, si sigue, ofrecer "Reintentar" al alumno que esperar hasta 90 s.
    read-timeout: 20s
  cerebras:
    # Opcional: inferencia muy rápida (chat), pero su alta pide tarjeta. Sin voz a texto: STT_PROVIDER=gemini.
    api-key: ${CEREBRAS_API_KEY:}
    base-url: https://api.cerebras.ai/v1
    chat-model: ${CEREBRAS_MODEL:gpt-oss-120b}
    transcription-model: ""
    temperature: 0.2
    max-tokens: 1500
    connect-timeout: 3s
    read-timeout: 20s
  mistral:
    api-key: ${MISTRAL_API_KEY:}
    base-url: https://api.mistral.ai/v1
    chat-model: ${MISTRAL_MODEL:mistral-small-latest}
    transcription-model: ${MISTRAL_TRANSCRIPTION_MODEL:voxtral-mini-latest}
    temperature: 0.2
    max-tokens: 1000
    connect-timeout: 3s
    read-timeout: 45s
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    chat-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    transcription-model: ${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
    temperature: 0.2
    # gpt-oss razona antes de responder: necesita holgura o el JSON sale truncado / la API rechaza
    max-tokens: 1500
    connect-timeout: 3s
    read-timeout: 45s

server:
  # Detrás de nginx: la IP real del cliente llega en X-Forwarded-For (solo se confía en proxies de red privada).
  forward-headers-strategy: native
  tomcat:
    # Tomcat lee hasta 10 MB de una subida rechazada para poder responder 413 con el error explicado;
    # por encima corta la conexión (protección frente a abusos).
    max-swallow-size: 10MB
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
