name: lms-tutor

# Stack completo:   docker compose up --build        → http://localhost:${APP_PORT:-8080}
# Solo la BD (dev): docker compose up -d postgres
#
# El backend usa network_mode: host para que Groq no bloquee la IP NAT del bridge de Docker
# ("Access denied. Please check your network settings"). Escucha en BACKEND_PORT (8081) y
# nginx (frontend) le habla vía host.docker.internal.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tutor}
      POSTGRES_USER: ${DB_USER:-tutor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (copia .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Misma pila de red que el host: Groq acepta la petición (desde el bridge responde 403).
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres publicado en el host (ver ports de postgres).
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT:-5433}
      DB_NAME: ${DB_NAME:-tutor}
      DB_USER: ${DB_USER:-tutor}
      DB_PASSWORD: ${DB_PASSWORD}
      # Evita choque con el puerto publicado del frontend (APP_PORT).
      SERVER_PORT: ${BACKEND_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -base64 48)}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      STT_PROVIDER: ${STT_PROVIDER:-${LLM_PROVIDER:-mock}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_QUESTIONS_PER_MINUTE: ${RATE_LIMIT_QUESTIONS_PER_MINUTE:-15}
      RATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE: ${RATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE:-15}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-8081}'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_UPSTREAM: host.docker.internal:${BACKEND_PORT:-8081}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
