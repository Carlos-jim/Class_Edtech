name: lms-tutor

# Stack completo:   docker compose up --build        → http://localhost:${APP_PORT:-8080}
# Solo la BD (dev): docker compose up -d postgres
#
# Red bridge por defecto (Linux, macOS y Windows). Si Groq responde 403 desde el bridge
# ("Access denied. Please check your network settings"), en Linux usa el override con red del host:
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up --build
# (o COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml en .env).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tutor}
      POSTGRES_USER: ${DB_USER:-tutor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (copia .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432 # puerto interno de la red de compose (no el publicado en el host)
      DB_NAME: ${DB_NAME:-tutor}
      DB_USER: ${DB_USER:-tutor}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -base64 48)}
      # Proveedor de IA (gemini | groq | mistral). Si falta la clave del elegido, el backend no arranca y explica cuál.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      STT_PROVIDER: ${STT_PROVIDER:-${LLM_PROVIDER:-gemini}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.5-flash-lite}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_TRANSCRIPTION_MODEL: ${MISTRAL_TRANSCRIPTION_MODEL:-voxtral-mini-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_QUESTIONS_PER_MINUTE: ${RATE_LIMIT_QUESTIONS_PER_MINUTE:-15}
      RATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE: ${RATE_LIMIT_TRANSCRIPTIONS_PER_MINUTE:-15}
    # Sin puertos publicados: solo es accesible a través de nginx (frontend).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-8080}'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
